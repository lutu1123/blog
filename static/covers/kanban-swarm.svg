<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141b3d"/>
      <stop offset="1" stop-color="#2b1e5e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="90" r="320" fill="url(#glow)"/>
  <circle cx="120" cy="560" r="260" fill="url(#glow)"/>
  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M100 0V630M220 0V630M340 0V630M460 0V630M580 0V630M700 0V630M820 0V630M940 0V630M1060 0V630"/>
  </g>
  <!-- kanban columns -->
  <g filter="url(#shadow)">
    <rect x="90" y="210" width="270" height="230" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="460" y="150" width="270" height="230" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <rect x="830" y="240" width="270" height="230" rx="14" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <!-- column headers -->
    <g font-family="ui-monospace,Consolas,monospace" font-size="17" fill="#a5b4fc">
      <text x="110" y="242">todo</text><text x="480" y="182">ready</text><text x="850" y="272">running</text>
    </g>
    <!-- cards -->
    <g>
      <rect x="110" y="260" width="230" height="44" rx="8" fill="#7c3aed"/>
      <rect x="110" y="314" width="230" height="44" rx="8" fill="#6d28d9"/>
      <rect x="110" y="368" width="230" height="44" rx="8" fill="#4c1d95"/>
      <rect x="480" y="200" width="230" height="52" rx="8" fill="#2563eb"/>
      <rect x="480" y="262" width="230" height="44" rx="8" fill="#1d4ed8"/>
      <rect x="850" y="290" width="230" height="62" rx="8" fill="url(#acc)"/>
      <!-- node dots -->
      <circle cx="1035" cy="321" r="8" fill="#ffffff" fill-opacity="0.9"/>
    </g>
  </g>
  <g font-family="ui-monospace,Consolas,Menlo,monospace" font-size="15" fill="#818cf8">
    <text x="90" y="120">swarm.topology · 5 workers · sqlite</text>
  </g>
  <g transform="translate(90,520)">
    <rect x="0" y="0" width="64" height="4" rx="2" fill="url(#acc)"/>
    <text x="0" y="40" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#e0e7ff" letter-spacing="1">Hermes Agent</text>
    <text x="0" y="76" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#94a3b8" letter-spacing="2">多智能体协作编排</text>
  </g>
</svg>