<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "style.css" | relURL }}">
  {{ with .Description }}<meta name="description" content="{{ . }}">{{ end }}
  {{ with .Site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}
  <meta name="theme-color" content="#4f46e5">
</head>
<body>
  <div class="progress-bar" id="progressBar"></div>

  <header class="site-header">
    <nav class="nav">
      <a class="nav-brand" href="{{ .Site.BaseURL }}">
        <span class="logo">路</span>
        <span>{{ .Site.Title }}</span>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="{{ .Site.BaseURL }}">首页</a>
        <a class="nav-link" href="https://github.com/lutu1123" target="_blank" rel="noopener">GitHub</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
      </div>
    </nav>
  </header>

  <main class="container">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <p>© {{ now.Year }} {{ .Site.Title }} · <a href="https://github.com/lutu1123/blog" target="_blank" rel="noopener">源码</a> · Powered by <a href="https://gohugo.io" target="_blank" rel="noopener">Hugo</a> on GitHub Pages</p>
  </footer>

  <script>
    // 阅读进度条
    const bar = document.getElementById('progressBar');
    function updateProgress() {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
    }
    document.addEventListener('scroll', updateProgress, { passive: true });
    updateProgress();

    // 主题切换(跟随系统偏好,可手动覆盖)
    const KEY = 'blog-theme';
    const saved = localStorage.getItem(KEY);
    const btn = document.getElementById('themeToggle');
    function apply(theme) {
      document.documentElement.dataset.theme = theme;
      btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    apply(saved || (systemDark ? 'dark' : 'light'));
    btn.addEventListener('click', () => {
      const next = (document.documentElement.dataset.theme === 'dark') ? 'light' : 'dark';
      localStorage.setItem(KEY, next);
      apply(next);
    });
  </script>
</body>
</html>
