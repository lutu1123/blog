{{ define "title" }}{{ .Title }} · {{ .Site.Title }}{{ end }}
{{ define "main" }}
<section class="posts">
  <h1>{{ .Title }}</h1>
  <ul class="post-list">
    {{ range .Pages }}
    <li>
      <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
      <span class="post-meta">{{ .Date.Format "2006-01-02" }} · {{ with .Params.author }}{{ . }}{{ end }}</span>
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
